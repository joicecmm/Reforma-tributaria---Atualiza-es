name: Monitor Reforma Tributária

on:
  schedule:
    # Roda todo dia às 11:00 UTC (08:00 no horário de Brasília)
    - cron: '0 11 * * *'
  workflow_dispatch: {}  # permite rodar manualmente pela aba "Actions" do GitHub

# Necessário para o workflow poder salvar (commitar) o arquivo de histórico
permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar robô
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
        run: python main.py

      - name: Salvar histórico atualizado no repositório
        run: |
          if [ -f seen_items.json ]; then
            git config --global user.name "reforma-tributaria-bot"
            git config --global user.email "actions@github.com"
            git add seen_items.json
            git diff --staged --quiet || git commit -m "Atualiza histórico de itens já notificados"
            git push
          else
            echo "Nenhuma atualização nova encontrada nesta execução — nada para salvar."
          fi
